<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/favicon-32x32.png"
    />

    <title>Frontend Mentor | Blog preview card</title>
    <meta name="description" content="Blog preview card about HTML and CSS foundations.">
    
    <link rel="preload" href="assets/fonts/figtree-v9-latin-500.woff2" as="font" type="font/woff2" crossorigin="anonymous">
    <link rel="preload" href="assets/fonts/figtree-v9-latin-800.woff2" as="font" type="font/woff2" crossorigin="anonymous">

    <link rel="stylesheet" href="styles/style.css">

  </head>
  <body>
    <main>
      <article class="card">
        <a class="card__link" href="https://www.google.com/">
          <img src="assets/images/illustration-article.svg" alt="" class="card__img" width="336" height="201">
          <div class="card__content">
            <span class="card__tag">Learning</span>
            <p class="card__published">Published <time datetime="2023-12-21" class="card__published-time">21 Dec 2023</time></p>
            <h1 class="card__title">HTML & CSS foundations</h1>
            <p class="card__description">These languages are the backbone of every website, defining structure, content, and presentation.</p>
          </div>
          <footer class="card__author">
            <img src="assets/images/image-avatar.webp" alt="Greg Hooper" class="card__author-img" width="64" height="65">
            <p class="card__author-name">Greg Hooper</p>
          </footer>
        </a>
      </article>
    </main>
  </body>
</html>
